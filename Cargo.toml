[package]
name = "mackerel_plugin"
version = "0.2.6"
edition = "2024"
description = "Mackerel plugin helper library"
repository = "https://github.com/itchyny/mackerel-plugin-rs"
authors = ["itchyny <itchyny@cybozu.co.jp>"]
license = "MIT"
readme = "README.md"
keywords = ["cli", "mackerel"]
rust-version = "1.88.0"

[dependencies]
auto_enums = "0.8.10"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.154"
serde_with = "3.24.0"
sha1 = "0.11.0"
strum = { version = "0.28.0", features = ["derive"] }

[dev-dependencies]
rstest = "0.28.0"
