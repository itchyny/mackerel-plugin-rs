name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euxo pipefail {0}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Test README.md example
        run: |
          sed -n '/```rust/,/```/{//!p;}' README.md > src/main.rs
          sed -i '/^\[dependencies\]$/arand = "0"' Cargo.toml
          cargo run

  release:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Create release
        run: |
          sed -n '/\['"${GITHUB_REF_NAME//./[.]}"']/,/^$/{//!p;}' CHANGELOG.md |
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "Release $GITHUB_REF_NAME" --notes-file -
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    name: Publish
    needs: release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
